<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iChing Cage</title>
    <link rel="preload" as="image" href="assets/iching-sheet.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <main class="app">
      <header class="hero">
        <h1>I CHING CAGE</h1>
      </header>

      <section class="panel">
        <div class="controls">
          <div class="view" role="group" aria-label="Vista">
            <button class="view-btn" data-view="random" aria-pressed="true" type="button">Aleatorio</button>
            <button class="view-btn" data-view="rows" aria-pressed="false" type="button">Filas 8</button>
            <button class="view-btn" data-view="shuffle" aria-pressed="false" type="button">Aleatorio 64</button>
            <button class="view-btn" data-view="sequence" aria-pressed="false" type="button">Secuencia</button>
            <button class="view-btn" data-view="manual" aria-pressed="false" type="button">Manual</button>
          </div>
          <div class="control-group" data-controls="random">
            <div class="mode" role="group" aria-label="Cantidad de hexagramas">
              <button class="mode-btn" data-count="1" aria-pressed="true" type="button">1</button>
              <button class="mode-btn" data-count="3" aria-pressed="false" type="button">3</button>
              <button class="mode-btn" data-count="6" aria-pressed="false" type="button">6</button>
            </div>
            <button id="rollBtn" class="roll" type="button">Lanzar dados</button>
          </div>
          <div class="control-group sequence-controls" data-controls="sequence">
            <button id="prevBtn" class="ghost" type="button">Anterior</button>
            <button id="nextBtn" class="ghost" type="button">Siguiente</button>
          </div>
          <div class="control-group manual-controls" data-controls="manual">
            <div class="lines" role="group" aria-label="Lineas">
              <button class="line-btn" data-line="0" type="button">—</button>
              <button class="line-btn" data-line="1" type="button">—</button>
              <button class="line-btn" data-line="2" type="button">—</button>
              <button class="line-btn" data-line="3" type="button">—</button>
              <button class="line-btn" data-line="4" type="button">—</button>
              <button class="line-btn" data-line="5" type="button">—</button>
            </div>
          </div>
        </div>

        <div class="status">
          <span id="modeLabel">Modo: Aleatorio</span>
          <span id="rollLabel">Ultima tirada: --</span>
        </div>

        <div class="grid" id="grid" data-count="1" data-view="random" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>

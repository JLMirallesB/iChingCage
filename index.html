<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iChing Cage</title>
    <link rel="preload" as="image" href="assets/iching-sheet.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <main class="app">
      <header class="hero">
        <h1>I CHING CAGE</h1>
      </header>

      <section class="panel">
        <div class="controls">
          <div class="mode-group">
            <label for="modeSelect">Modos de juego</label>
            <select id="modeSelect">
              <option value="random">Aleatorio</option>
              <option value="rows">Filas de 8</option>
              <option value="design">Diseña</option>
              <option value="complete">Completo</option>
            </select>
          </div>
          <div class="control-group" data-controls="random">
            <div class="mode" role="group" aria-label="Cantidad de hexagramas">
              <button class="mode-btn" data-count="1" aria-pressed="true" type="button">1</button>
              <button class="mode-btn" data-count="3" aria-pressed="false" type="button">3</button>
              <button class="mode-btn" data-count="6" aria-pressed="false" type="button">6</button>
            </div>
            <button id="rollBtn" class="roll" type="button">Lanzar dados</button>
          </div>
          <div class="control-group" data-controls="rows">
            <label for="rowSelect">Fila</label>
            <select id="rowSelect">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
            </select>
          </div>
          <div class="control-group design-controls" data-controls="design">
            <div class="lines" role="group" aria-label="Lineas">
              <button class="line-btn" data-line="0" type="button">—</button>
              <button class="line-btn" data-line="1" type="button">—</button>
              <button class="line-btn" data-line="2" type="button">—</button>
              <button class="line-btn" data-line="3" type="button">—</button>
              <button class="line-btn" data-line="4" type="button">—</button>
              <button class="line-btn" data-line="5" type="button">—</button>
            </div>
            <div class="design-preview">
              <div class="hex design-hex" id="designHex" role="img" aria-label="Hexagrama manual"></div>
              <div class="hex-label" id="designLabel">Hexagrama 1</div>
              <div class="design-info" id="designInfo"></div>
            </div>
          </div>
          <div class="control-group complete-controls" data-controls="complete">
            <div class="complete-mode">
              <label for="completeSelect">Modo</label>
              <select id="completeSelect">
                <option value="shuffle">Aleatorio</option>
                <option value="circular">Aleatorio circular</option>
                <option value="sequence">Secuencia Wen</option>
              </select>
            </div>
            <div class="complete-auto">
              <label for="autoplaySelect">Autoplay</label>
              <select id="autoplaySelect">
                <option value="0">Off</option>
                <option value="0.5">0.5s</option>
                <option value="1">1.0s</option>
                <option value="1.5">1.5s</option>
                <option value="2">2.0s</option>
                <option value="2.5">2.5s</option>
                <option value="3" selected>3.0s</option>
                <option value="3.5">3.5s</option>
                <option value="4">4.0s</option>
                <option value="4.5">4.5s</option>
                <option value="5">5.0s</option>
              </select>
            </div>
            <div class="complete-nav">
              <button id="prevBtn" class="ghost" type="button">Anterior</button>
              <button id="nextBtn" class="ghost" type="button">Siguiente</button>
            </div>
            <div class="progress">
              <div class="progress-bar" id="progressBar"></div>
            </div>
            <span id="progressText">1 / 64</span>
          </div>
        </div>

        <div class="status">
          <span id="modeLabel">Modo: Aleatorio</span>
          <span id="rollLabel">Ultima tirada: --</span>
        </div>

        <div class="grid" id="grid" data-count="1" data-view="random" aria-live="polite"></div>
      </section>
    </main>

  </body>
</html>
